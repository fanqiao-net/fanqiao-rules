[Rule]
# 局域网和私有地址直连
RULE-SET,https://testingcf.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Lan/Lan.list,DIRECT
# 广告（精简版，避免规则过大占用 iOS 网络扩展内存）
DOMAIN-SET,https://testingcf.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/AdvertisingLite/AdvertisingLite_Domain.list,广告拦截
RULE-SET,https://testingcf.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/AdvertisingLite/AdvertisingLite.list,广告拦截
# 阻断 HTTP/3 QUIC (UDP 443)，让 Safari/YouTube/App 毫秒级回落到 TCP HTTP/2，避免晚高峰 UDP-over-TCP 卡死
AND,((PROTOCOL,UDP),(DEST-PORT,443)),REJECT
